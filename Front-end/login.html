<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acesse sua Conta - Banco Gringotts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="formularios.css">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="mobile.css">
  </head>
  <body>
    <main>
      <section id="login" class="secao-login">
        <div class="login-container">
          <h2>Acesse sua Conta</h2>
          <form class="form-login">
            <div class="campo-input">
              <label for="usuario">E-mail ou CBF</label>
              <input type="text" id="usuario" name="usuario" required />
            </div>

            <div class="campo-input">
              <label for="senha">Senha</label>
              <input type="password" id="senha" name="senha" required />
            </div>

            <button type="submit" class="btn-entrar">ENTRAR NO COFRE</button>

            <!-- Ações Secundárias -->
            <div class="acoes-login">
              <a href="cadastro.html" class="link-cadastro">Não sou cliente (Abrir Conta)</a>
              <a href="index.html" class="btn-voltar">Voltar</a>
            </div>
          </form>
        </div>
      </section>
    </main>
    <script src="login.js?v=2" defer></script>
  </body>
</html>
