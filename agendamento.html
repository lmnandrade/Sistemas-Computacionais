<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agendamento | Gringotts Bank</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="agendamento.css">
  </head>
  <body>
    <main>
            <section class="secao-agendamento-form">
                <div class="agendamento-container">
                    <h2>Agendar Visita</h2>
                    <p class="subtitulo">Reserve seu horário no Salão Principal de Mármore com os duendes.</p>

                    <!-- BLOCO 1: FORMULÁRIO -->
                    <div id="container-form">
                    <form action="#" method="POST" class="form-agendamento">
                        
                        <div class="campo-input">
                        <label for="nome">Nome Completo (ou Título Bruxo)</label>
                        <input type="text" id="nome" name="nome" placeholder="Ex: Alvo Dumbledore" required />
                        </div>

                        <div class="linha-dupla">
                        <div class="campo-input">
                            <label for="email">E-mail / Coruja</label>
                            <input type="email" id="email" name="email" placeholder="coruja@hogwarts.edu" required />
                        </div>

                        <div class="campo-input">
                            <label for="telefone">Espelho Comunicador / Telefone</label>
                            <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999" />
                        </div>
                        </div>

                        <div class="linha-dupla">
                        <div class="campo-input">
                            <label for="servico">Serviço Desejado</label>
                            <select id="servico" name="servico" required>
                            <option value="" disabled selected>Selecione...</option>
                            <option value="acesso">Acesso ao Cofre</option>
                            <option value="cambio">Câmbio Trouxa</option>
                            <option value="abertura">Abertura de Cofre</option>
                            <option value="artefatos">Avaliação de Artefatos</option>
                            </select>
                        </div>

                        <div class="campo-input">
                            <label for="cofre">Nº do Cofre (opcional)</label>
                            <input type="text" id="cofre" name="cofre" placeholder="Ex: Cofre 687" />
                        </div>
                        </div>

                        <div class="linha-dupla">
                        <div class="campo-input">
                            <label for="data">Data da Visita</label>
                            <input type="date" id="data" name="data" lang="pt-BR" required />
                        </div>

                        <div class="campo-input">
                            <label for="horario">Horário Preferencial</label>
                            <select id="horario" name="horario" required>
                            <option value="" disabled selected>Escolha...</option>
                            <option value="09:00">09:00</option>
                            <option value="11:00">11:00</option>
                            <option value="14:00">14:00</option>
                            <option value="16:30">16:30</option>
                            </select>
                        </div>
                        </div>

                        <div class="campo-input">
                        <label for="observacoes">Observações de Segurança</label>
                        <textarea id="observacoes" name="observacoes" rows="3" placeholder="Informe se transportará artefatos sob maldição ou se necessita de transporte subterrâneo especial."></textarea>
                        </div>

                        <button type="submit" class="btn-agendar">Confirmar Agendamento</button>

                        <div class="acoes-agendamento">
                        <a href="index.html" class="btn-voltar">Voltar</a>
                        </div>
                    </form>
                    </div>

                    <!-- BLOCO 2: TELA DE CONFIRMAÇÃO (INICIA OCULTA) -->
                    <div id="container-sucesso" style="display: none;">
                    <div id="mensagem-conteudo" class="mensagem-agendamento sucesso"></div>
                    
                    <div class="acoes-agendamento" style="margin-top: 1.5rem;">
                        <button type="button" id="btn-novo-agendamento" class="btn-agendar">Novo Agendamento</button>
                        <a href="index.html" class="btn-voltar">Voltar</a>
                    </div>
                    </div>

                </div>
                </section>
            </body>
    </main>
    <script src="agendamento.js"></script>
</html>
